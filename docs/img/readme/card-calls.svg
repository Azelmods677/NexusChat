<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img"><defs><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff" fill-opacity=".055"/></pattern><radialGradient id="g"><stop offset="0" stop-color="#53A6E6" stop-opacity=".3"/><stop offset="1" stop-color="#53A6E6" stop-opacity="0"/></radialGradient></defs><rect width="640" height="250" rx="24" fill="#08090B"/><rect width="640" height="250" rx="24" fill="url(#dots)"/><rect x="1" y="1" width="638" height="248" rx="23" fill="none" stroke="#53A6E6" stroke-opacity=".4"/><circle cx="90" cy="125" r="130" fill="url(#g)"/><g transform="translate(40 75)"><path d="M14 20 C10 70 50 110 100 100 L104 78 L78 66 L66 78 C52 72 42 62 36 48 L48 36 L38 12 Z" fill="#53A6E6"/><path d="M58 62 a18 18 0 0 1 18 18" fill="none" stroke="#53A6E6" stroke-width="6" stroke-linecap="round"><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="0.0s" repeatCount="indefinite"/></path><path d="M70 50 a32 32 0 0 1 32 32" fill="none" stroke="#53A6E6" stroke-width="6" stroke-linecap="round"><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="0.3s" repeatCount="indefinite"/></path><path d="M82 38 a46 46 0 0 1 46 46" fill="none" stroke="#53A6E6" stroke-width="6" stroke-linecap="round"><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="0.6s" repeatCount="indefinite"/></path></g><text x="176" y="84" font-size="31" font-weight="800" fill="#F1F3F5">Llamadas sin intermediarios</text><text x="176" y="124" font-size="18.5" fill="#B7BDC4">Voz y vídeo directos entre teléfonos,</text><text x="176" y="152" font-size="18.5" fill="#B7BDC4">a pantalla completa. Con el modo anónimo,</text><text x="176" y="180" font-size="18.5" fill="#B7BDC4">el otro no ve tu IP.</text></svg>
