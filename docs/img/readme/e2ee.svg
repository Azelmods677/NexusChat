<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img"><defs><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff" fill-opacity=".055"/></pattern><linearGradient id="a" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1280" y2="300"><stop offset="0" stop-color="#2FB38E"><animate attributeName="stop-color" values="#2FB38E;#53A6E6;#A78BFA;#FF5C73;#F2B544;#2FB38E" dur="16s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#53A6E6"><animate attributeName="stop-color" values="#53A6E6;#A78BFA;#FF5C73;#F2B544;#2FB38E;#53A6E6" dur="16s" repeatCount="indefinite"/></stop></linearGradient></defs><rect width="1280" height="300" rx="24" fill="#08090B"/><rect width="1280" height="300" rx="24" fill="url(#dots)"/><rect x="60" y="30" width="170" height="240" rx="26" fill="#000" stroke="#3A4048" stroke-width="2"/><text x="145" y="66" font-size="16" font-weight="700" fill="#F1F3F5" text-anchor="middle">Tú</text><rect x="76" y="120" width="138" height="48" rx="16" fill="url(#a)" fill-opacity=".3" stroke="url(#a)"/><text x="145" y="150" font-size="16" fill="#F1F3F5" text-anchor="middle">¿Nos vemos?</text><rect x="1050" y="30" width="170" height="240" rx="26" fill="#000" stroke="#3A4048" stroke-width="2"/><text x="1135" y="66" font-size="16" font-weight="700" fill="#F1F3F5" text-anchor="middle">Luna</text><rect x="1066" y="120" width="138" height="48" rx="16" fill="url(#a)" fill-opacity=".3" stroke="url(#a)"/><text x="1135" y="150" font-size="16" fill="#F1F3F5" text-anchor="middle">¿Nos vemos?</text><path d="M240 144 L1040 144" stroke="url(#a)" stroke-width="2.5" stroke-dasharray="6 10"><animate attributeName="stroke-dashoffset" values="32;0" dur="1s" repeatCount="indefinite"/></path><text x="640" y="60" font-size="30" font-weight="800" fill="#F1F3F5" text-anchor="middle">Se cifra en tu teléfono. Se abre en el suyo.</text><text x="640" y="94" font-size="18" fill="#8D949C" text-anchor="middle">Por el camino solo viaja texto ilegible: la clave privada nunca sale de tu móvil.</text><rect x="510" y="200" width="260" height="46" rx="14" fill="#14171B" stroke="#3A4048"/><text x="640" y="230" font-size="18" fill="#8D949C" text-anchor="middle" font-family="monospace">Servidor: 9f3a·c1e7·42bd</text><g><animateMotion dur="4s" repeatCount="indefinite" path="M250 144 L1030 144" keyPoints="0;1;1" keyTimes="0;.8;1" calcMode="linear"/><rect x="-44" y="-24" width="88" height="48" rx="14" fill="#14171B" stroke="url(#a)" stroke-width="2"/><rect x="-11" y="-5" width="22" height="17" rx="4" fill="url(#a)"/><path d="M-7 -5 V-10 a7 7 0 0 1 14 0 V-5" fill="none" stroke="url(#a)" stroke-width="3"/></g></svg>
