<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img"><defs><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff" fill-opacity=".055"/></pattern><radialGradient id="g"><stop offset="0" stop-color="#3DD68C" stop-opacity=".3"/><stop offset="1" stop-color="#3DD68C" stop-opacity="0"/></radialGradient></defs><rect width="640" height="250" rx="24" fill="#08090B"/><rect width="640" height="250" rx="24" fill="url(#dots)"/><rect x="1" y="1" width="638" height="248" rx="23" fill="none" stroke="#3DD68C" stroke-opacity=".4"/><circle cx="90" cy="125" r="130" fill="url(#g)"/><g transform="translate(40 75)"><rect x="0" y="10" width="112" height="90" rx="14" fill="#14171B" stroke="#3DD68C" stroke-width="3"/><path d="M18 40 L34 54 L18 68" fill="none" stroke="#3DD68C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="44" y="64" width="34" height="7" rx="3" fill="#3DD68C"><animate attributeName="opacity" values="1;0;1" dur="1s" calcMode="discrete" repeatCount="indefinite"/></rect></g><text x="176" y="84" font-size="31" font-weight="800" fill="#F1F3F5">Un portátil en tu bolsillo</text><text x="176" y="124" font-size="18.5" fill="#B7BDC4">Editor con pestañas y búsqueda, terminal real</text><text x="176" y="152" font-size="18.5" fill="#B7BDC4">y Kali Linux de verdad. Tus agentes</text><text x="176" y="180" font-size="18.5" fill="#B7BDC4">dejan ahí lo que programan.</text></svg>
