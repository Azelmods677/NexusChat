<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img"><defs><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff" fill-opacity=".055"/></pattern><radialGradient id="g"><stop offset="0" stop-color="#2FB38E" stop-opacity=".3"/><stop offset="1" stop-color="#2FB38E" stop-opacity="0"/></radialGradient></defs><rect width="640" height="250" rx="24" fill="#08090B"/><rect width="640" height="250" rx="24" fill="url(#dots)"/><rect x="1" y="1" width="638" height="248" rx="23" fill="none" stroke="#2FB38E" stroke-opacity=".4"/><circle cx="90" cy="125" r="130" fill="url(#g)"/><g transform="translate(40 75)"><rect x="18" y="42" width="64" height="52" rx="12" fill="#2FB38E"/><path d="M32 42 V28 a18 18 0 0 1 36 0 V42" fill="none" stroke="#2FB38E" stroke-width="8" stroke-linecap="round"><animate attributeName="stroke-dasharray" values="0 200;110 200;110 200" dur="3s" repeatCount="indefinite"/></path><circle cx="50" cy="66" r="7" fill="#08090B"><animate attributeName="r" values="5;8;5" dur="1.6s" repeatCount="indefinite"/></circle></g><text x="176" y="84" font-size="31" font-weight="800" fill="#F1F3F5">Solo tú lo lees</text><text x="176" y="124" font-size="18.5" fill="#B7BDC4">Chats, grupos y chats secretos cifrados</text><text x="176" y="152" font-size="18.5" fill="#B7BDC4">de extremo a extremo. Reacciones, encuestas,</text><text x="176" y="180" font-size="18.5" fill="#B7BDC4">carpetas, programados y chats ocultos.</text></svg>
