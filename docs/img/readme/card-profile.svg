<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img"><defs><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff" fill-opacity=".055"/></pattern><radialGradient id="g"><stop offset="0" stop-color="#E86A92" stop-opacity=".3"/><stop offset="1" stop-color="#E86A92" stop-opacity="0"/></radialGradient></defs><rect width="640" height="250" rx="24" fill="#08090B"/><rect width="640" height="250" rx="24" fill="url(#dots)"/><rect x="1" y="1" width="638" height="248" rx="23" fill="none" stroke="#E86A92" stroke-opacity=".4"/><circle cx="90" cy="125" r="130" fill="url(#g)"/><g transform="translate(40 75)"><circle cx="55" cy="55" r="48" fill="none" stroke="#E86A92" stroke-width="6" stroke-dasharray="40 10"><animateTransform attributeName="transform" type="rotate" from="0 55 55" to="360 55 55" dur="10s" repeatCount="indefinite"/></circle><circle cx="55" cy="55" r="36" fill="#E86A92" fill-opacity=".22"/><path d="M44 36 L76 55 L44 74 Z" fill="#E86A92"><animate attributeName="opacity" values=".5;1;.5" dur="1.6s" repeatCount="indefinite"/></path></g><text x="176" y="84" font-size="31" font-weight="800" fill="#F1F3F5">Perfiles con vida</text><text x="176" y="124" font-size="18.5" fill="#B7BDC4">Portada y foto de perfil en vídeo de hasta</text><text x="176" y="152" font-size="18.5" fill="#B7BDC4">1:30, galería a pantalla completa</text><text x="176" y="180" font-size="18.5" fill="#B7BDC4">y 40 colores de perfil.</text></svg>
