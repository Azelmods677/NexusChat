<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 470" width="100%" style="max-width:300px;background-color:#0F0F1A" role="img" aria-label="Recorrido de versiones de NexusChat, terminando en la v6 como version final">
  <title>Recorrido de versiones de NexusChat</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#AB9EFF"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6E6A8A"/>
    </marker>
    <linearGradient id="finalFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2A1F4D"/>
      <stop offset="100%" stop-color="#1B1733"/>
    </linearGradient>
  </defs>

  <g font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">

    <!-- v4 -->
    <rect x="20" y="16" width="260" height="52" rx="10" fill="#1F2020" stroke="#CCCCCC" stroke-width="1"/>
    <text x="150" y="38" fill="#CCCCCC" font-size="13" font-weight="600">v4 · Design System</text>
    <text x="150" y="56" fill="#9A9AA8" font-size="12">y estabilidad</text>

    <line x1="150" y1="68" x2="150" y2="94" stroke="#AB9EFF" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- v5 -->
    <rect x="20" y="100" width="260" height="52" rx="10" fill="#1F2020" stroke="#CCCCCC" stroke-width="1"/>
    <text x="150" y="122" fill="#CCCCCC" font-size="13" font-weight="600">v5 · IA multi-proveedor</text>
    <text x="150" y="140" fill="#9A9AA8" font-size="12">y backend desplegable</text>

    <line x1="150" y1="152" x2="150" y2="178" stroke="#AB9EFF" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- v6 - version final -->
    <rect x="20" y="184" width="260" height="62" rx="10" fill="url(#finalFill)" stroke="#AB9EFF" stroke-width="2"/>
    <text x="150" y="207" fill="#FFFFFF" font-size="14" font-weight="700">v6 · Versión final</text>
    <text x="150" y="225" fill="#C7C0F0" font-size="11.5">Teléfono, funciones de IA, 2FA,</text>
    <text x="150" y="239" fill="#C7C0F0" font-size="11.5">anti-manipulación y correcciones</text>

    <line x1="150" y1="246" x2="150" y2="286" stroke="#6E6A8A" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowMuted)"/>
    <text x="163" y="270" fill="#6E6A8A" font-size="10.5" font-style="italic" text-anchor="start">sin planificar</text>

    <!-- Fuera de alcance -->
    <rect x="20" y="292" width="260" height="46" rx="10" fill="#15151F" stroke="#6E6A8A" stroke-width="1" stroke-dasharray="5,4"/>
    <text x="150" y="313" fill="#8A8698" font-size="12.5">Play Billing real</text>
    <text x="150" y="329" fill="#6E6A8A" font-size="11">(Premium hoy no cobra)</text>

    <rect x="20" y="352" width="260" height="46" rx="10" fill="#15151F" stroke="#6E6A8A" stroke-width="1" stroke-dasharray="5,4"/>
    <text x="150" y="373" fill="#8A8698" font-size="12.5">Tema claro completo</text>
    <text x="150" y="389" fill="#6E6A8A" font-size="11">(tokens ya preparados)</text>

    <rect x="20" y="412" width="260" height="46" rx="10" fill="#15151F" stroke="#6E6A8A" stroke-width="1" stroke-dasharray="5,4"/>
    <text x="150" y="433" fill="#8A8698" font-size="12.5">E2EE en grupos</text>
    <text x="150" y="449" fill="#6E6A8A" font-size="11">(hoy solo chats 1:1)</text>

  </g>
</svg>
