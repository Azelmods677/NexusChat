# Project-wide Gradle settings.

# ── JVM / Daemon ──────────────────────────────────────────
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.workers.max=2

# AndroidX
android.useAndroidX=true
# Jetifier disabled - all dependencies are AndroidX native
android.enableJetifier=false
kotlin.code.style=official
android.nonTransitiveRClass=true

# ── Gradle Configuration / Caching ────────────────────────
# Configuration cache disabled intentionally (Hilt + KSP compatibility)
org.gradle.configuration-cache=false
org.gradle.caching=true

# Parallel disabled intentionally (Windows long-path KSP workaround)
org.gradle.parallel=false

# ── Java home (required for AGP 8.7.3) ───────────────────
# NO fijes aqui org.gradle.java.home.
#
# Esta linea contenia una ruta absoluta de Windows
# (C:\Program Files\Android\Android Studio\jbr). Como gradle.properties SI se
# versiona, esa ruta viajaba a todo el que clonara el repositorio: en Linux, en
# macOS o en un Windows con Android Studio instalado en otro sitio, Gradle aborta
# al arrancar con "Java home supplied is invalid". Eso es justo lo que tumbaba el
# CI de GitHub a los 7 segundos, antes siquiera de descargar Gradle.
#
# Sin esta propiedad, Gradle usa el JDK de quien compila: el JBR embebido cuando
# se abre en Android Studio, y el del sistema (JAVA_HOME) en linea de comandos.
# Si alguna vez necesitas fijarlo en TU maquina, ponlo en el gradle.properties
# de tu usuario (~/.gradle/gradle.properties), que no se versiona.

# ── Kotlin compiler ───────────────────────────────────────
kotlin.daemon.jvmargs=-Xmx1536m
kotlin.incremental=true
kotlin.incremental.java=true

# ── KSP options - Fix for Windows long paths ──────────────
ksp.incremental=false
ksp.incremental.log=false
ksp.use.worker.api=false

# ── Android / R8 ──────────────────────────────────────────
# Suppress compileSdk warning for Android 16 (API 36)
android.suppressUnsupportedCompileSdk=36
# R8 full mode: more aggressive dead-code elimination and optimizations
android.enableR8.fullMode=true
